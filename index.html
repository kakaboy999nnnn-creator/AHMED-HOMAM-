<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فن يحچي 3D - نجوم وأسماء</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000000; font-family: 'Arial', 'Tahoma', sans-serif; }
        canvas { display: block; }
        /* تلميح بسيط */
        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            pointer-events: none;
            font-family: 'Arial', sans-serif;
            letter-spacing: 1px;
            z-index: 10;
        }
    </style>
    <!-- Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div class="info">✨ فن يحچي • اسحب للتدوير</div>
<script>
    (function() {
        // --- المشهد، الكاميرا، المُعَرِّض ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 9);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // التحكم بالكاميرا
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.target.set(0, 0, 0);
        controls.rotateSpeed = 0.7;
        controls.zoomSpeed = 1.0;

        // --- إضاءة ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(1, 2, 4);
        scene.add(dirLight);
        const backLight = new THREE.DirectionalLight(0x446688, 0.6);
        backLight.position.set(-2, 0, -3);
        scene.add(backLight);

        // --- 1. الكوكب الرئيسي ---
        const earthGeo = new THREE.SphereGeometry(2.1, 80, 80);
        const earthMat = new THREE.MeshStandardMaterial({ 
            color: 0xffffff, 
            roughness: 0.3, 
            metalness: 0.1,
            emissive: new THREE.Color(0x111122)
        });
        const earth = new THREE.Mesh(earthGeo, earthMat);
        earth.position.set(-1, 0, 0);
        scene.add(earth);

        const loader = new THREE.TextureLoader();
        loader.load('./myimage.jpg', 
            (tex) => {
                earthMat.map = tex;
                earthMat.needsUpdate = true;
                earthMat.emissive.setHex(0x000000);
            },
            undefined,
            (err) => console.warn('لم يتم العثور على myimage.jpg', err)
        );

        // --- 2. الغبار الفضائي (Nebula) ---
        const nebulaGeo = new THREE.SphereGeometry(18, 48, 48);
        const nebulaCanvas = document.createElement('canvas');
        nebulaCanvas.width = 512; nebulaCanvas.height = 512;
        const ctx = nebulaCanvas.getContext('2d');
        ctx.fillStyle = '#000000'; 
        ctx.fillRect(0, 0, 512, 512);
        for (let i = 0; i < 120; i++) {
            const r = 30 + Math.random() * 120;
            const g = 10 + Math.random() * 60;
            const b = 150 + Math.random() * 105;
            ctx.fillStyle = `rgba(${r|0}, ${g|0}, ${b|0}, ${Math.random() * 0.35 + 0.1})`;
            ctx.beginPath();
            ctx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 180 + 20, 0, Math.PI * 2);
            ctx.fill();
        }
        for (let i = 0; i < 30; i++) {
            ctx.fillStyle = `rgba(200, 180, 255, ${Math.random() * 0.2})`;
            ctx.beginPath();
            ctx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 60 + 10, 0, Math.PI * 2);
            ctx.fill();
        }
        const nebulaMat = new THREE.MeshBasicMaterial({
            map: new THREE.CanvasTexture(nebulaCanvas),
            side: THREE.BackSide,
            transparent: true,
            opacity: 0.55
        });
        const nebula = new THREE.Mesh(nebulaGeo, nebulaMat);
        scene.add(nebula);

        // --- 3. الكويكب Ali ---
        const aliGeo = new THREE.SphereGeometry(0.8, 48, 48);
        const aliMat = new THREE.MeshStandardMaterial({
            color: 0x00ffff,
            emissive: new THREE.Color(0x004466),
            roughness: 0.2,
            metalness: 0.7
        });
        const ali = new THREE.Mesh(aliGeo, aliMat);
        ali.position.set(2.8, 0, 0);
        scene.add(ali);

        // --- 4. النصوص (العنوان واسم Ali) ---
        function createText(text, color, yPos, xPos, size = 3.2, fontSize = 80) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 12;
            ctx.fillStyle = color;
            ctx.font = `Bold ${fontSize}px 'Arial', 'Tahoma', sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;
            ctx.fillText(text, 256, 64);
            ctx.shadowColor = 'transparent';
            ctx.fillText(text, 256, 64);
            
            const tex = new THREE.CanvasTexture(canvas);
            tex.needsUpdate = true;
            const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, side: THREE.DoubleSide });
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(size, size * 0.35), mat);
            mesh.position.set(xPos, yPos, 0.05);
            return mesh;
        }

        const titleText = createText('فن يحچي', '#ffffff', 3.4, -1, 3.8, 90);
        scene.add(titleText);
        const aliText = createText('Ali', '#ff66ff', 1.5, 2.8, 2.2, 70);
        scene.add(aliText);

        // --- 5. نظام النجوم الأساسي (الكثيف) ---
        const starsCount = 6000;
        const starsGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(starsCount * 3);
        const colors = new Float32Array(starsCount * 3);
        const sizes = new Float32Array(starsCount);

        const radius = 40;
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            const r = radius * Math.cbrt(Math.random());
            positions[i*3] = Math.sin(phi) * Math.cos(theta) * r;
            positions[i*3+1] = Math.sin(phi) * Math.sin(theta) * r;
            positions[i*3+2] = Math.cos(phi) * r;

            const colorVal = 0.7 + Math.random() * 0.5;
            const tint = Math.random();
            if (tint < 0.6) {
                colors[i*3] = colorVal;
                colors[i*3+1] = colorVal * (0.8 + Math.random() * 0.2);
                colors[i*3+2] = 1.0;
            } else if (tint < 0.85) {
                colors[i*3] = 1.0;
                colors[i*3+1] = 0.7 + Math.random() * 0.3;
                colors[i*3+2] = 0.3 + Math.random() * 0.2;
            } else {
                colors[i*3] = 0.9 + Math.random() * 0.3;
                colors[i*3+1] = 0.3 + Math.random() * 0.3;
                colors[i*3+2] = 0.9 + Math.random() * 0.3;
            }
            sizes[i] = 0.05 + Math.random() * 0.25;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        starsGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        starsGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        const starCanvas = document.createElement('canvas');
        starCanvas.width = 32; starCanvas.height = 32;
        const sCtx = starCanvas.getContext('2d');
        const gradient = sCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(0.3, 'rgba(255,255,255,0.9)');
        gradient.addColorStop(0.7, 'rgba(180,180,255,0.6)');
        gradient.addColorStop(1, 'rgba(255,255,255,0)');
        sCtx.fillStyle = gradient;
        sCtx.fillRect(0, 0, 32, 32);
        const starTexture = new THREE.CanvasTexture(starCanvas);

        const starsMaterial = new THREE.PointsMaterial({
            size: 0.2,
            map: starTexture,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            vertexColors: true,
            opacity: 0.95,
            sizeAttenuation: true
        });
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        // --- 6. نجوم إضافية صغيرة جداً ---
        const tinyStarsCount = 4000;
        const tinyGeo = new THREE.BufferGeometry();
        const tinyPos = new Float32Array(tinyStarsCount * 3);
        for (let i = 0; i < tinyStarsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            const r = 60 + Math.random() * 30;
            tinyPos[i*3] = Math.sin(phi) * Math.cos(theta) * r;
            tinyPos[i*3+1] = Math.sin(phi) * Math.sin(theta) * r;
            tinyPos[i*3+2] = Math.cos(phi) * r;
        }
        tinyGeo.setAttribute('position', new THREE.BufferAttribute(tinyPos, 3));
        const tinyMat = new THREE.PointsMaterial({
            color: 0x88aaff,
            size: 0.08,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true
        });
        const tinyStars = new THREE.Points(tinyGeo, tinyMat);
        scene.add(tinyStars);

        // --- 7. النجوم المخصصة بالأسماء (المطلوبة) ---
        // قائمة الأسماء بالترتيب
        const names = [
            "رَوَاحة الكُبْرى",
            "جَواهِر",
            "ابو ذيبة",
            "المسيحي",
            "ضُّحَى",
            "إِسْكَنْدَر",
            "Dha",
            "جورج وسوف"
        ];

        // ألوان مميزة لكل نجمة (يمكن تخصيصها)
        const starColors = [
            0xffaa88, 0x88ddff, 0xff99cc, 0x99ff99, 
            0xffcc66, 0xcc88ff, 0x66ccff, 0xff8866
        ];

        // مواقع النجوم في الفضاء (موزعة بشكل جميل حول المشهد)
        // نضعها في نصف كرة أمامي مع بعض التوزيع العشوائي
        const starPositions = [
            { x: -2.5, y: 1.8, z: 2.5 },
            { x: 1.2, y: 2.5, z: 2.0 },
            { x: 3.5, y: -1.2, z: 1.8 },
            { x: -3.0, y: -2.0, z: 2.2 },
            { x: 0.5, y: -2.8, z: 2.0 },
            { x: -1.8, y: 2.8, z: 1.5 },
            { x: 2.8, y: 1.0, z: 2.8 },
            { x: -3.8, y: -0.5, z: 2.0 }
        ];

        // مجموعة لتخزين النجوم والأسماء للتحريك
        const namedStars = [];

        names.forEach((name, index) => {
            const pos = starPositions[index % starPositions.length];
            // نضيف بعض التوزيع العشوائي الخفيف حول الموقع
            const offsetX = (Math.random() - 0.5) * 0.4;
            const offsetY = (Math.random() - 0.5) * 0.4;
            const offsetZ = (Math.random() - 0.5) * 0.4;
            const finalPos = {
                x: pos.x + offsetX,
                y: pos.y + offsetY,
                z: pos.z + offsetZ
            };

            // 7.1 نجمة لامعة (كروية) لهذا الشخص
            const starGeo = new THREE.SphereGeometry(0.22, 16, 16);
            const starMat = new THREE.MeshStandardMaterial({
                color: starColors[index % starColors.length],
                emissive: starColors[index % starColors.length],
                emissiveIntensity: 0.6,
                roughness: 0.2,
                metalness: 0.1
            });
            const starMesh = new THREE.Mesh(starGeo, starMat);
            starMesh.position.set(finalPos.x, finalPos.y, finalPos.z);
            scene.add(starMesh);

            // 7.2 هالة حول النجمة (تأثير توهج)
            const glowGeo = new THREE.SphereGeometry(0.35, 8, 8);
            const glowMat = new THREE.MeshBasicMaterial({
                color: starColors[index % starColors.length],
                transparent: true,
                opacity: 0.2,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const glowMesh = new THREE.Mesh(glowGeo, glowMat);
            glowMesh.position.copy(starMesh.position);
            scene.add(glowMesh);

            // 7.3 اسم الشخص فوق النجمة
            // نستخدم Sprite أو CanvasTexture، نختار Sprite ليكون دائماً مواجهاً للكاميرا
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx2 = canvas.getContext('2d');
            ctx2.clearRect(0, 0, canvas.width, canvas.height);
            
            // خلفية شفافة مع ظل خفيف
            ctx2.shadowColor = 'rgba(0,0,0,0.9)';
            ctx2.shadowBlur = 16;
            ctx2.shadowOffsetX = 2;
            ctx2.shadowOffsetY = 2;
            
            ctx2.fillStyle = '#ffffff';
            ctx2.font = 'Bold 68px "Arial", "Tahoma", sans-serif';
            ctx2.textAlign = 'center';
            ctx2.textBaseline = 'middle';
            ctx2.fillText(name, 256, 64);
            
            // نعيد الكتابة بدون ظل للوضوح
            ctx2.shadowColor = 'transparent';
            ctx2.fillStyle = '#ffffff';
            ctx2.font = 'Bold 68px "Arial", "Tahoma", sans-serif';
            ctx2.fillText(name, 256, 64);
            
            // إضافة تظليل خفيف للاسم (لون ثانوي) لإبرازه
            ctx2.shadowColor = 'rgba(0,0,0,0.5)';
            ctx2.shadowBlur = 8;
            ctx2.fillStyle = '#ffffff';
            ctx2.fillText(name, 256, 64);

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            
            // استخدام SpriteMaterial مع Sprite ليكون دائماً باتجاه الكاميرا
            const spriteMat = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending, // يجعله يندمج مع الخلفية بشكل جميل
                opacity: 0.95
            });
            const sprite = new THREE.Sprite(spriteMat);
            // نضع الاسم فوق النجمة بمسافة
            sprite.position.set(finalPos.x, finalPos.y + 0.7, finalPos.z);
            // حجم الاسم يتناسب مع المسافة (لكن الـ Sprite يتكيف مع الكاميرا)
            // نضبط الحجم الأولي ليكون واضحاً من دون تكبير
            sprite.scale.set(1.6, 0.4, 1);
            scene.add(sprite);

            // تخزين للتحريك (يمكن إضافة دوران للنجوم)
            namedStars.push({
                star: starMesh,
                glow: glowMesh,
                label: sprite,
                basePos: new THREE.Vector3(finalPos.x, finalPos.y, finalPos.z),
                phase: Math.random() * Math.PI * 2
            });
        });

        // --- 8. تحريك العناصر ---
        function animate() {
            requestAnimationFrame(animate);

            // دوران الكوكب والكويكب
            earth.rotation.y += 0.004;
            earth.rotation.x += 0.001;
            ali.rotation.y += 0.008;
            ali.rotation.z += 0.003;

            // دوران السديم
            nebula.rotation.y += 0.0003;
            nebula.rotation.x += 0.0001;

            // دوران النجوم الخلفية
            stars.rotation.y += 0.00008;
            stars.rotation.x += 0.00002;
            tinyStars.rotation.y -= 0.00005;

            // تحريك النجوم المخصصة (اهتزاز خفيف وتوهج)
            const time = Date.now() * 0.001;
            namedStars.forEach((item, idx) => {
                // اهتزاز بسيط للنجمة
                const offset = Math.sin(time * 1.2 + item.phase) * 0.03;
                item.star.position.y = item.basePos.y + offset;
                item.glow.position.y = item.basePos.y + offset;
                item.label.position.y = item.basePos.y + 0.7 + offset * 0.5;
                
                // دوران النجمة حول نفسها
                item.star.rotation.x += 0.02;
                item.star.rotation.y += 0.03;
                
                // تغير بسيط في شفافية الهالة
                const pulse = Math.sin(time * 1.8 + item.phase) * 0.1 + 0.2;
                item.glow.material.opacity = pulse;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // --- التكيف مع تغير حجم النافذة ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        console.log('✨ فن يحچي 3D - مع نجوم وأسماء الأعضاء!');
    })();
</script>
</body>
</html>
