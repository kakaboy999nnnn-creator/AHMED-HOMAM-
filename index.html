<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فن يحچي 3D — نجوم بيضاء</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Arial','Tahoma',sans-serif; }
  canvas { display:block; }
  .info { position:fixed; bottom:18px; left:18px; color:rgba(255,255,255,.28); font-size:12px; letter-spacing:1px; z-index:10; pointer-events:none; text-shadow:0 0 6px rgba(0,0,0,.9); direction:rtl; }
  .hint { position:fixed; bottom:18px; right:18px; color:rgba(255,255,255,.2); font-size:11px; z-index:10; pointer-events:none; direction:rtl; }
  #loader { position:fixed; inset:0; background:#000; color:rgba(255,255,255,.55); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:99; font-size:14px; letter-spacing:1px; text-align:center; padding:20px; direction:rtl; transition:opacity .8s ease; }
  #errBox { color:#ff6b6b; font-size:13px; max-width:580px; line-height:1.9; display:none; white-space:pre-wrap; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/three@0.128.0/build/three.min.js'"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js" onerror="this.onerror=null;this.src='https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js'"></script>
</head>
<body>
<div id="loader">
  <div>✨ جاري تشكيل الكون…</div>
  <div id="errBox"></div>
</div>
<div class="info">✨ فن يحچي • اسحب للتدوير • عجلة الفأرة للتقريب</div>
<div class="hint">☄️ ترقّب الشهب العابرة</div>
<script>
'use strict';
(function(){
  var loaderEl = document.getElementById('loader');
  var errBox = document.getElementById('errBox');
  function showError(msg){
    if (!errBox) return;
    errBox.style.display = 'block';
    errBox.textContent = '⚠️ حدث خطأ:\n' + msg +
      '\n\nحلول سريعة:\n- افتح الصفحة في متصفح Chrome أو Edge على الحاسوب.\n- تأكد من اتصال الإنترنت (المكتبات تُحمَّل من الإنترنت).\n- انسخ نص الخطأ أعلاه وأرسله لي لأساعدك بالضبط.';
  }
  window.addEventListener('error', function(e){
    if (e && e.message) showError(e.message);
  });
  function webglOK(){
    try {
      var c = document.createElement('canvas');
      return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
    } catch(e){ return false; }
  }
  if (typeof THREE === 'undefined'){
    showError('لم يتم تحميل مكتبة Three.js — يبدو أن اتصال الإنترنت مقطوع أو أن المواقع (cdnjs/jsdelivr) محجوبة. جرّب فتح الصفحة من متصفح آخر أو من شبكة مختلفة.');
    return;
  }
  if (!webglOK()){
    showError('متصفحك أو التطبيق الذي فتحت فيه الصفحة لا يدعم WebGL (الرسومات ثلاثية الأبعاد). افتح الملف في Chrome أو Firefox أو Edge على الحاسوب.');
    return;
  }

  try { main(); }
  catch(e){
    showError((e && e.message ? e.message : e) + (e && e.stack ? '\nفي: ' + e.stack.split('\n')[1] : ''));
  }

  /* ===================== التطبيق الرئيسي ===================== */
  function main(){
    const rand    = (a,b) => a + Math.random()*(b-a);
    const gauss   = () => (Math.random()+Math.random()+Math.random()-1.5)/1.5;
    const easeOutCubic = t => 1 - Math.pow(1-t,3);
    const randDir = () => {
      const th = Math.random()*Math.PI*2;
      const ph = Math.acos(rand(-1,1));
      return new THREE.Vector3(Math.sin(ph)*Math.cos(th), Math.sin(ph)*Math.sin(th), Math.cos(ph));
    };
    const IS_MOBILE = window.innerWidth<768 || (navigator.maxTouchPoints||0)>1;
    const D = IS_MOBILE ? 0.5 : 1;

    /* --- المشهد والكاميرا والمُعَرِّض --- */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.FogExp2(0x000000, 0.0012);

    const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 400);
    const INTRO_FROM = new THREE.Vector3(2.2, 4.5, 19);
    const INTRO_TO   = new THREE.Vector3(0, 2.2, 11);
    camera.position.copy(INTRO_FROM);

    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false, powerPreference:'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, IS_MOBILE ? 1.6 : 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.setClearColor(0x000000, 1);
    document.body.appendChild(renderer.domElement);

    let controls = null, manualRotate = false;
    if (THREE.OrbitControls){
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.07;
      controls.autoRotate = false;
      controls.target.set(0,0,0);
      controls.minDistance = 3.4;
      controls.maxDistance = 26;
      controls.minPolarAngle = 0.2;
      controls.maxPolarAngle = Math.PI - 0.2;
      controls.enabled = false;
    } else { manualRotate = true; }

    const clock = new THREE.Clock();
    let elapsed = 0;

    /* --- الإضاءة --- */
    scene.add(new THREE.AmbientLight(0x334466, 0.55));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.35);
    dirLight.position.set(3, 5, 7);
    scene.add(dirLight);
    const fillLight = new THREE.DirectionalLight(0x6688bb, 0.5);
    fillLight.position.set(-4, -1, -2);
    scene.add(fillLight);
    const rimLight = new THREE.PointLight(0x88ccff, 0.9, 30);
    rimLight.position.set(-6, 3, -4);
    scene.add(rimLight);

    /* --- 1) الكوكب: جسم + سحب + غلاف جوي + حلقة + قمر --- */
    const planetGroup = new THREE.Group();
    planetGroup.position.set(-1, 0, 0);
    scene.add(planetGroup);

    const earthMat = new THREE.MeshStandardMaterial({
      color: 0x4488aa, roughness: 0.32, metalness: 0.12, emissive: 0x112233
    });
    const earth = new THREE.Mesh(new THREE.SphereGeometry(2.1, 96, 96), earthMat);
    planetGroup.add(earth);

    const cloudMat = new THREE.MeshStandardMaterial({
      color: 0xffffff, transparent: true, opacity: 0.16, roughness: 0.9,
      depthWrite: false, side: THREE.FrontSide
    });
    const clouds = new THREE.Mesh(new THREE.SphereGeometry(2.17, 64, 64), cloudMat);
    planetGroup.add(clouds);

    const atmosphere = new THREE.Mesh(
      new THREE.SphereGeometry(2.55, 48, 48),
      new THREE.ShaderMaterial({
        uniforms: { glowColor: { value: new THREE.Color(0x3a8fd4) } },
        vertexShader: [
          'varying vec3 vNormal; varying vec3 vPosition;',
          'void main(){',
          '  vNormal = normalize(normalMatrix * normal);',
          '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
          '  vPosition = mv.xyz;',
          '  gl_Position = projectionMatrix * mv;',
          '}'
        ].join('\n'),
        fragmentShader: [
          'uniform vec3 glowColor;',
          'varying vec3 vNormal; varying vec3 vPosition;',
          'void main(){',
          '  vec3 V = normalize(-vPosition);',
          '  float i = pow(0.68 - dot(V, vNormal), 2.5);',
          '  gl_FragColor = vec4(glowColor, i * 0.9);',
          '}'
        ].join('\n'),
        side: THREE.BackSide, transparent: true,
        blending: THREE.AdditiveBlending, depthWrite: false
      })
    );
    planetGroup.add(atmosphere);

    const ring = new THREE.Mesh(
      new THREE.RingGeometry(3.05, 4.4, 96),
      new THREE.MeshBasicMaterial({
        color: 0x88bbdd, transparent: true, opacity: 0.14,
        side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending
      })
    );
    ring.rotation.x = Math.PI / 2.55;
    ring.rotation.z = 0.4;
    planetGroup.add(ring);

    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(0.3, 24, 24),
      new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.8, metalness: 0.05 })
    );
    planetGroup.add(moon);

    const loader = new THREE.TextureLoader();
    loader.load('./myimage.jpg',
      (tex) => {
        earthMat.map = tex;
        earthMat.color.setHex(0xffffff);
        earthMat.emissive.setHex(0x000000);
        earthMat.needsUpdate = true;
      },
      undefined,
      () => console.warn('myimage.jpg غير موجود — استخدام اللون الافتراضي')
    );

    /* --- 2) السديم: طبقتان --- */
    function createNebula(radius, colorFn, opacity, count){
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#000'; ctx.fillRect(0,0,512,512);
      for (let i=0;i<count;i++){
        const c = colorFn();
        ctx.fillStyle = 'rgba(' + (c[0]|0) + ',' + (c[1]|0) + ',' + (c[2]|0) + ',' + rand(0.04,0.22) + ')';
        ctx.beginPath();
        ctx.arc(rand(0,512), rand(0,512), rand(20,190), 0, Math.PI*2);
        ctx.fill();
      }
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(radius, 48, 48),
        new THREE.MeshBasicMaterial({
          map: new THREE.CanvasTexture(canvas), side: THREE.BackSide,
          transparent: true, opacity: opacity,
          blending: THREE.AdditiveBlending, depthWrite: false
        })
      );
      return mesh;
    }
    const nebula  = createNebula(22, () => [rand(12,70), rand(8,35), rand(40,120)], 0.30, 140);
    scene.add(nebula);
    const nebula2 = createNebula(15, () => [rand(60,110), rand(20,50), rand(90,160)], 0.22, 90);
    nebula2.rotation.z = 1.2; nebula2.rotation.x = 0.5;
    scene.add(nebula2);

    /* --- 3) كويكب Ali (نفس الأصل) --- */
    const aliCanvas = document.createElement('canvas');
    aliCanvas.width = 256; aliCanvas.height = 256;
    const aliCtx = aliCanvas.getContext('2d');
    const aliGrad = aliCtx.createLinearGradient(0,0,256,256);
    ['#ff0080','#ff8c00','#ffee00','#00ff88','#00baff','#a000ff','#ff0080']
      .forEach((c,i)=>{ aliGrad.addColorStop(i/6, c); });
    aliCtx.fillStyle = aliGrad; aliCtx.fillRect(0,0,256,256);
    for (let i=0;i<220;i++){
      aliCtx.fillStyle = 'hsla(' + rand(0,360) + ',100%,65%,' + rand(0,0.35) + ')';
      aliCtx.beginPath();
      aliCtx.arc(rand(0,256), rand(0,256), rand(2,20), 0, Math.PI*2);
      aliCtx.fill();
    }
    const aliTexture = new THREE.CanvasTexture(aliCanvas);
    aliTexture.wrapS = aliTexture.wrapT = THREE.RepeatWrapping;

    const aliMat = new THREE.MeshStandardMaterial({
      map: aliTexture, color: 0xffffff, emissive: 0xffffff,
      emissiveMap: aliTexture, emissiveIntensity: 0.5,
      roughness: 0.25, metalness: 0.6
    });
    const ali = new THREE.Mesh(new THREE.SphereGeometry(0.8, 64, 64), aliMat);
    ali.position.set(2.8, 0, 0);
    scene.add(ali);
    const aliGlow = new THREE.Mesh(
      new THREE.SphereGeometry(1.15, 24, 24),
      new THREE.MeshBasicMaterial({
        color: 0x66aaff, transparent: true, opacity: 0.08,
        blending: THREE.AdditiveBlending, depthWrite: false
      })
    );
    ali.add(aliGlow);

    /* --- 4) النصوص (نفس الأصل) --- */
    function createText(text, color, yPos, xPos, size, fontSize){
      size = size || 3.2; fontSize = fontSize || 80;
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 14;
      ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
      ctx.fillStyle = color;
      ctx.font = 'Bold ' + fontSize + 'px Arial, Tahoma, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, 512, 64);
      ctx.shadowColor = 'rgba(0,0,0,0)';
      ctx.fillText(text, 512, 64);
      const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(size, size*0.35),
        new THREE.MeshBasicMaterial({
          map: new THREE.CanvasTexture(canvas), transparent: true,
          depthWrite: false, side: THREE.DoubleSide
        })
      );
      mesh.position.set(xPos, yPos, 0.05);
      return mesh;
    }
    scene.add(createText('فن يحچي', '#ffffff', 3.4, -1, 3.8, 90));
    scene.add(createText('Ali', '#ff66ff', 1.5, 2.8, 2.2, 70));

    /* --- 5) النجوم الواقعية: ShaderMaterial (أحجام متباينة + وميض) --- */
    const starCount = Math.floor(9000 * D);
    const sPos = new Float32Array(starCount*3);
    const sCol = new Float32Array(starCount*3);
    const sSiz = new Float32Array(starCount);
    const sTwk = new Float32Array(starCount*2);
    for (let i=0;i<starCount;i++){
      const th = Math.random()*Math.PI*2;
      const ph = Math.acos(rand(-1,1));
      const r  = 35 * Math.cbrt(Math.random()) + 8;
      sPos[i*3]   = Math.sin(ph)*Math.cos(th)*r;
      sPos[i*3+1] = Math.sin(ph)*Math.sin(th)*r;
      sPos[i*3+2] = Math.cos(ph)*r;
      const t = Math.random();
      const c = new THREE.Color().setHSL(0.6 - t*0.6, 0.35 + t*0.45, 0.65 + t*0.3);
      sCol[i*3] = c.r; sCol[i*3+1] = c.g; sCol[i*3+2] = c.b;
      sSiz[i] = (0.05 + Math.pow(Math.random(), 3.2) * 0.75) * (IS_MOBILE ? 1.6 : 1);
      sTwk[i*2]   = rand(0.6, 2.6);
      sTwk[i*2+1] = rand(0, Math.PI*2);
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
    starGeo.setAttribute('customColor', new THREE.BufferAttribute(sCol, 3));
    starGeo.setAttribute('size', new THREE.BufferAttribute(sSiz, 1));
    starGeo.setAttribute('twinkle', new THREE.BufferAttribute(sTwk, 2));

    const starTexCanvas = document.createElement('canvas');
    starTexCanvas.width = starTexCanvas.height = 64;
    const stx = starTexCanvas.getContext('2d');
    const sg = stx.createRadialGradient(32,32,0,32,32,32);
    sg.addColorStop(0,'rgba(255,255,255,1)');
    sg.addColorStop(0.25,'rgba(255,255,255,0.85)');
    sg.addColorStop(0.6,'rgba(200,210,255,0.3)');
    sg.addColorStop(1,'rgba(255,255,255,0)');
    stx.fillStyle = sg; stx.fillRect(0,0,64,64);

    const starsMat = new THREE.ShaderMaterial({
      uniforms: {
        uTexture: { value: new THREE.CanvasTexture(starTexCanvas) },
        uTime:    { value: 0 },
        uPixelRatio: { value: renderer.getPixelRatio() }
      },
      vertexShader: [
        'attribute float size;',
        'attribute vec2 twinkle;',
        'attribute vec3 customColor;',
        'uniform float uTime;',
        'uniform float uPixelRatio;',
        'varying vec3 vColor;',
        'varying float vTwinkle;',
        'void main(){',
        '  vColor = customColor;',
        '  vTwinkle = 0.72 + 0.28 * sin(uTime * twinkle.x + twinkle.y);',
        '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
        '  gl_PointSize = clamp(size * uPixelRatio * (300.0 / -mv.z), 1.0, 128.0);',
        '  gl_Position = projectionMatrix * mv;',
        '}'
      ].join('\n'),
      fragmentShader: [
        'uniform sampler2D uTexture;',
        'varying vec3 vColor;',
        'varying float vTwinkle;',
        'void main(){',
        '  vec4 tex = texture2D(uTexture, gl_PointCoord);',
        '  gl_FragColor = vec4(vColor, 1.0) * tex * vTwinkle;',
        '}'
      ].join('\n'),
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    });
    const stars = new THREE.Points(starGeo, starsMat);
    scene.add(stars);

    /* --- 6) نجوم خلفية صغيرة --- */
    const tinyCount = Math.floor(4000 * D);
    const tinyGeo = new THREE.BufferGeometry();
    const tinyPos = new Float32Array(tinyCount*3);
    for (let i=0;i<tinyCount;i++){
      const d = randDir().multiplyScalar(rand(60, 90));
      tinyPos[i*3] = d.x; tinyPos[i*3+1] = d.y; tinyPos[i*3+2] = d.z;
    }
    tinyGeo.setAttribute('position', new THREE.BufferAttribute(tinyPos, 3));
    const tinyStars = new THREE.Points(tinyGeo, new THREE.PointsMaterial({
      color: 0x446688, size: 0.06, transparent: true,
      blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
    }));
    scene.add(tinyStars);

    /* --- 7) المجرتان الحلزونيتان --- */
    function createGalaxy(p){
      const count = Math.floor(p.count * D);
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(count*3);
      const colors = new Float32Array(count*3);
      const inside = new THREE.Color(p.inside);
      const outside = new THREE.Color(p.outside);
      for (let i=0;i<count;i++){
        const i3 = i*3;
        const r = Math.random() * p.radius;
        const spinAngle = r * p.spin;
        const branchAngle = (i % p.branches) / p.branches * Math.PI * 2;
        const rndX = Math.pow(Math.random(), p.rndPower) * (Math.random()<0.5?1:-1) * p.rnd * r;
        const rndY = Math.pow(Math.random(), p.rndPower) * (Math.random()<0.5?1:-1) * p.rnd * r * 0.4;
        const rndZ = Math.pow(Math.random(), p.rndPower) * (Math.random()<0.5?1:-1) * p.rnd * r;
        positions[i3]   = Math.cos(branchAngle + spinAngle) * r + rndX;
        positions[i3+1] = rndY;
        positions[i3+2] = Math.sin(branchAngle + spinAngle) * r + rndZ;
        const m = inside.clone().lerp(outside, r/p.radius);
        colors[i3] = m.r; colors[i3+1] = m.g; colors[i3+2] = m.b;
      }
      geometry.setAttribute('position', new THREE.BufferAttribute(positions,3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors,3));
      const points = new THREE.Points(geometry, new THREE.PointsMaterial({
        size: p.size, sizeAttenuation: true, depthWrite: false,
        blending: THREE.AdditiveBlending, vertexColors: true,
        transparent: true, opacity: 0.92
      }));
      points.position.copy(p.position);
      points.rotation.set(p.rotX, p.rotY, p.rotZ);
      scene.add(points);
      return points;
    }
    const galaxy1 = createGalaxy({
      count: 12000, radius: 5.5, branches: 3, spin: 1.1,
      rnd: 0.32, rndPower: 3, size: 0.16,
      inside: 0xffd8a8, outside: 0x2a5b9e,
      position: new THREE.Vector3(-7, 2.5, -10),
      rotX: 1.25, rotY: 0.4, rotZ: 0.5
    });
    const galaxy2 = createGalaxy({
      count: 8000, radius: 4.2, branches: 4, spin: 1.3,
      rnd: 0.3, rndPower: 3, size: 0.13,
      inside: 0xffb3d9, outside: 0x6a3fbf,
      position: new THREE.Vector3(10, -1.5, -9),
      rotX: -1.1, rotY: -0.5, rotZ: -0.4
    });

    /* --- 8) الغبار الفضائي --- */
    const dustCount = Math.floor(1300 * D);
    const dustGeo = new THREE.BufferGeometry();
    const dustPos = new Float32Array(dustCount*3);
    const dustCol = new Float32Array(dustCount*3);
    for (let i=0;i<dustCount;i++){
      const d = randDir().multiplyScalar(rand(4, 26));
      dustPos[i*3] = d.x; dustPos[i*3+1] = d.y; dustPos[i*3+2] = d.z;
      const blue = rand(0.35, 0.6), violet = rand(0.3, 0.55);
      dustCol[i*3] = blue; dustCol[i*3+1] = blue*0.75; dustCol[i*3+2] = violet;
    }
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
    dustGeo.setAttribute('color', new THREE.BufferAttribute(dustCol, 3));
    const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
      size: 0.12, sizeAttenuation: true, transparent: true, opacity: 0.32,
      blending: THREE.AdditiveBlending, depthWrite: false, vertexColors: true
    }));
    scene.add(dust);

    /* --- 9) الشهب العابرة --- */
    const meteors = [];
    for (let i=0;i<5;i++){
      const geo = new THREE.BufferGeometry();
      const posA = new Float32Array(6);
      const colA = new Float32Array(6);
      posA.set([0,0,0, 0,0,0]);
      colA.set([1,0.95,0.85, 0.05,0.05,0.15]);
      geo.setAttribute('position', new THREE.BufferAttribute(posA, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colA, 3));
      const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
        vertexColors: true, blending: THREE.AdditiveBlending,
        transparent: true, opacity: 0.85, depthWrite: false
      }));
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.06, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, blending: THREE.AdditiveBlending })
      );
      const group = new THREE.Group();
      group.add(line); group.add(head);
      group.visible = false
