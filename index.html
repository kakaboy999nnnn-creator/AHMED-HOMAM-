<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فن يحچي 3D - نجوم</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000000; }
        canvas { display: block; }
    </style>
    <!-- Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<script>
    (function() {
        // --- المشهد، الكاميرا، المُعَرِّض ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510); // خلفية عميقة مائلة للزرقة

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0.8, 8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // التحكم بالكاميرا (OrbitControls) مع إعدادات أكثر سلاسة
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.target.set(0, 0, 0);
        controls.rotateSpeed = 0.8;

        // --- إضاءة محيطية قوية للكوكب والنصوص (لأننا نستخدم MeshBasicMaterial، لكن نضيف إضاءة للشكل العام) ---
        // نضيف إضاءة منتشرة لتسليط الضوء على التفاصيل (حتى مع Basic مواد، الإضاءة لا تؤثر لكننا نضعها للمستقبل)
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(1, 2, 4);
        scene.add(dirLight);
        const backLight = new THREE.DirectionalLight(0x446688, 0.6);
        backLight.position.set(-2, 0, -3);
        scene.add(backLight);

        // --- 1. الكوكب الرئيسي (نفس الصورة) ---
        const earthGeo = new THREE.SphereGeometry(2.1, 80, 80);
        const earthMat = new THREE.MeshStandardMaterial({ 
            color: 0xffffff, 
            roughness: 0.3, 
            metalness: 0.1,
            emissive: new THREE.Color(0x111122)
        });
        const earth = new THREE.Mesh(earthGeo, earthMat);
        earth.position.set(-1, 0, 0);
        scene.add(earth);

        // تحميل الصورة المخصصة (myimage.jpg) مع معالجة الخطأ
        const loader = new THREE.TextureLoader();
        loader.load('./myimage.jpg', 
            (tex) => {
                earthMat.map = tex;
                earthMat.needsUpdate = true;
                earthMat.emissive.setHex(0x000000); // إزالة الإضاءة الذاتية عند تحميل الصورة
            },
            undefined,
            (err) => console.warn('لم يتم العثور على myimage.jpg، استخدم لون افتراضي.', err)
        );

        // --- 2. الغبار الفضائي (Nebula) بنسيج محسّن ---
        const nebulaGeo = new THREE.SphereGeometry(18, 48, 48);
        const nebulaCanvas = document.createElement('canvas');
        nebulaCanvas.width = 512; nebulaCanvas.height = 512;
        const ctx = nebulaCanvas.getContext('2d');
        ctx.fillStyle = '#000000'; 
        ctx.fillRect(0, 0, 512, 512);
        // غبار أكثر كثافة بألوان متنوعة
        for (let i = 0; i < 120; i++) {
            const r = 30 + Math.random() * 120;
            const g = 10 + Math.random() * 60;
            const b = 150 + Math.random() * 105;
            ctx.fillStyle = `rgba(${r|0}, ${g|0}, ${b|0}, ${Math.random() * 0.35 + 0.1})`;
            ctx.beginPath();
            ctx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 180 + 20, 0, Math.PI * 2);
            ctx.fill();
        }
        // إضافة بعض البقع الساطعة
        for (let i = 0; i < 30; i++) {
            ctx.fillStyle = `rgba(200, 180, 255, ${Math.random() * 0.2})`;
            ctx.beginPath();
            ctx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 60 + 10, 0, Math.PI * 2);
            ctx.fill();
        }
        const nebulaMat = new THREE.MeshBasicMaterial({
            map: new THREE.CanvasTexture(nebulaCanvas),
            side: THREE.BackSide,
            transparent: true,
            opacity: 0.55
        });
        const nebula = new THREE.Mesh(nebulaGeo, nebulaMat);
        scene.add(nebula);

        // --- 3. الكويكب Ali (محسّن بمادة Standard وإضاءة) ---
        const aliGeo = new THREE.SphereGeometry(0.8, 48, 48);
        const aliMat = new THREE.MeshStandardMaterial({
            color: 0x00ffff,
            emissive: new THREE.Color(0x004466),
            roughness: 0.2,
            metalness: 0.7
        });
        const ali = new THREE.Mesh(aliGeo, aliMat);
        ali.position.set(2.8, 0, 0);
        scene.add(ali);

        // --- 4. النصوص (تحسين الوضوح مع إضاءة خلفية) ---
        function createText(text, color, yPos, xPos, size = 3.2, fontSize = 80) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            // خلفية شفافة
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // ظل خفيف للنص
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 12;
            ctx.fillStyle = color;
            ctx.font = `Bold ${fontSize}px 'Arial', 'Tahoma', sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;
            ctx.fillText(text, 256, 64);
            // إعادة الرسم بدون ظل للحدة
            ctx.shadowColor = 'transparent';
            ctx.fillText(text, 256, 64);
            
            const tex = new THREE.CanvasTexture(canvas);
            tex.needsUpdate = true;
            const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, side: THREE.DoubleSide });
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(size, size * 0.35), mat);
            mesh.position.set(xPos, yPos, 0.05);
            return mesh;
        }

        const titleText = createText('فن يحچي', '#ffffff', 3.4, -1, 3.8, 90);
        scene.add(titleText);
        const aliText = createText('Ali', '#ff66ff', 1.5, 2.8, 2.2, 70);
        scene.add(aliText);

        // --- 5. نظام النجوم الكثيف (المطلوب) ---
        // نستخدم Points مع عدد كبير من النجوم (5000) موزعة في كرة كبيرة
        const starsCount = 6000;
        const starsGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(starsCount * 3);
        const colors = new Float32Array(starsCount * 3);
        const sizes = new Float32Array(starsCount);

        const radius = 40; // نصف قطر توزيع النجوم

        for (let i = 0; i < starsCount; i++) {
            // توزيع كروي مع بعض التكتلات
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            const r = radius * Math.cbrt(Math.random()); // توزيع مكعب لتكثيف النجوم في الداخل قليلاً

            positions[i*3] = Math.sin(phi) * Math.cos(theta) * r;
            positions[i*3+1] = Math.sin(phi) * Math.sin(theta) * r;
            positions[i*3+2] = Math.cos(phi) * r;

            // ألوان متنوعة: أبيض، أزرق فاتح، أصفر خفيف، بنفسجي
            const colorVal = 0.7 + Math.random() * 0.5;
            const tint = Math.random();
            if (tint < 0.6) {
                // أبيض مائل للأزرق
                colors[i*3] = colorVal;
                colors[i*3+1] = colorVal * (0.8 + Math.random() * 0.2);
                colors[i*3+2] = 1.0;
            } else if (tint < 0.85) {
                // أصفر برتقالي
                colors[i*3] = 1.0;
                colors[i*3+1] = 0.7 + Math.random() * 0.3;
                colors[i*3+2] = 0.3 + Math.random() * 0.2;
            } else {
                // بنفسجي / وردي
                colors[i*3] = 0.9 + Math.random() * 0.3;
                colors[i*3+1] = 0.3 + Math.random() * 0.3;
                colors[i*3+2] = 0.9 + Math.random() * 0.3;
            }

            // أحجام متفاوتة (نجوم صغيرة وكبيرة)
            sizes[i] = 0.05 + Math.random() * 0.25;
        }

        starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        starsGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        starsGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        // إنشاء نسيج دائري للنجوم (نقطة ناعمة)
        const starCanvas = document.createElement('canvas');
        starCanvas.width = 32; starCanvas.height = 32;
        const sCtx = starCanvas.getContext('2d');
        const gradient = sCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(0.3, 'rgba(255,255,255,0.9)');
        gradient.addColorStop(0.7, 'rgba(180,180,255,0.6)');
        gradient.addColorStop(1, 'rgba(255,255,255,0)');
        sCtx.fillStyle = gradient;
        sCtx.fillRect(0, 0, 32, 32);
        const starTexture = new THREE.CanvasTexture(starCanvas);

        const starsMaterial = new THREE.PointsMaterial({
            size: 0.2,
            map: starTexture,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            vertexColors: true,
            opacity: 0.95,
            sizeAttenuation: true
        });

        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        // --- 6. نجوم إضافية صغيرة جداً (مكثفة) في الخلفية ---
        const tinyStarsCount = 4000;
        const tinyGeo = new THREE.BufferGeometry();
        const tinyPos = new Float32Array(tinyStarsCount * 3);
        for (let i = 0; i < tinyStarsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            const r = 60 + Math.random() * 30; // بعيدة جداً
            tinyPos[i*3] = Math.sin(phi) * Math.cos(theta) * r;
            tinyPos[i*3+1] = Math.sin(phi) * Math.sin(theta) * r;
            tinyPos[i*3+2] = Math.cos(phi) * r;
        }
        tinyGeo.setAttribute('position', new THREE.BufferAttribute(tinyPos, 3));
        const tinyMat = new THREE.PointsMaterial({
            color: 0x88aaff,
            size: 0.08,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true
        });
        const tinyStars = new THREE.Points(tinyGeo, tinyMat);
        scene.add(tinyStars);

        // --- 7. بعض النجوم المتلألئة (تأثير إضافي) لكننا نكتفي بالدوران ---

        // --- التحريك مع دوران كل العناصر ---
        function animate() {
            requestAnimationFrame(animate);

            // دوران الكوكب والكويكب
            earth.rotation.y += 0.004;
            earth.rotation.x += 0.001;
            ali.rotation.y += 0.008;
            ali.rotation.z += 0.003;

            // دوران السديم ببطء
            nebula.rotation.y += 0.0003;
            nebula.rotation.x += 0.0001;

            // دوران النجوم بشكل بطيء جداً لإحساس بالحركة
            stars.rotation.y += 0.00008;
            stars.rotation.x += 0.00002;
            tinyStars.rotation.y -= 0.00005;

            // تحديث الـ controls (مع damping)
            controls.update();

            renderer.render(scene, camera);
        }

        animate();

        // --- التكيف مع تغير حجم النافذة ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // إضافة تعليمات بسيطة (اختياري) في console
        console.log('✨ فن يحچي 3D مع نجوم كثيفة! 🚀');
    })();
</script>
</body>
</html>
