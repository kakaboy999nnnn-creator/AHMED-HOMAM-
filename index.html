<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فن يحچي 3D - نجوم بيضاء</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000000; font-family: 'Arial', 'Tahoma', sans-serif; }
        canvas { display: block; }
        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            pointer-events: none;
            font-family: 'Arial', sans-serif;
            letter-spacing: 1px;
            z-index: 10;
        }
    </style>
    <!-- Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div class="info">✨ فن يحچي • اسحب للتدوير</div>
<script>
    (function() {
        // --- المشهد، الكاميرا، المُعَرِّض ---
        const scene = new THREE.Scene();
        // خلفية سوداء خالصة
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 9);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // التحكم بالكاميرا
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.target.set(0, 0, 0);
        controls.rotateSpeed = 0.7;
        controls.zoomSpeed = 1.0;

        // ساعة داخلية لحساب الزمن الحقيقي
        const clock = new THREE.Clock();

        // --- إضاءة ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(1, 2, 4);
        scene.add(dirLight);
        const backLight = new THREE.DirectionalLight(0x446688, 0.6);
        backLight.position.set(-2, 0, -3);
        scene.add(backLight);

        // --- 1. الكوكب الرئيسي ---
        const earthGeo = new THREE.SphereGeometry(2.1, 80, 80);
        const earthMat = new THREE.MeshStandardMaterial({ 
            color: 0x4488aa,
            roughness: 0.3, 
            metalness: 0.1,
            emissive: new THREE.Color(0x112233)
        });
        const earth = new THREE.Mesh(earthGeo, earthMat);
        earth.position.set(-1, 0, 0);
        scene.add(earth);

        // محاولة تحميل الصورة
        const loader = new THREE.TextureLoader();
        loader.load('./myimage.jpg', 
            (tex) => {
                earthMat.map = tex;
                earthMat.needsUpdate = true;
                earthMat.color.setHex(0xffffff);
                earthMat.emissive.setHex(0x000000);
            },
            undefined,
            (err) => {
                console.warn('لم يتم العثور على myimage.jpg، سيتم استخدام اللون الافتراضي', err);
                earthMat.color.setHex(0x4488aa);
            }
        );

        // --- 2. الغبار الفضائي (Nebula) ---
        const nebulaGeo = new THREE.SphereGeometry(18, 48, 48);
        const nebulaCanvas = document.createElement('canvas');
        nebulaCanvas.width = 512; nebulaCanvas.height = 512;
        const ctx = nebulaCanvas.getContext('2d');
        ctx.fillStyle = '#000000'; 
        ctx.fillRect(0, 0, 512, 512);
        for (let i = 0; i < 120; i++) {
            const r = 10 + Math.random() * 50;
            const g = 10 + Math.random() * 30;
            const b = 30 + Math.random() * 60;
            ctx.fillStyle = `rgba(${r|0}, ${g|0}, ${b|0}, ${Math.random() * 0.25 + 0.05})`;
            ctx.beginPath();
            ctx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 180 + 20, 0, Math.PI * 2);
            ctx.fill();
        }
        for (let i = 0; i < 20; i++) {
            ctx.fillStyle = `rgba(40, 30, 80, ${Math.random() * 0.1})`;
            ctx.beginPath();
            ctx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 60 + 10, 0, Math.PI * 2);
            ctx.fill();
        }
        const nebulaMat = new THREE.MeshBasicMaterial({
            map: new THREE.CanvasTexture(nebulaCanvas),
            side: THREE.BackSide,
            transparent: true,
            opacity: 0.35
        });
        const nebula = new THREE.Mesh(nebulaGeo, nebulaMat);
        scene.add(nebula);

        // --- 3. الكويكب Ali (متعدد الألوان ومتغيّر باستمرار) ---
        const aliGeo = new THREE.SphereGeometry(0.8, 48, 48);

        const aliCanvas = document.createElement('canvas');
        aliCanvas.width = 256; aliCanvas.height = 256;
        const aliCtx = aliCanvas.getContext('2d');
        const aliGrad = aliCtx.createLinearGradient(0, 0, 256, 256);
        aliGrad.addColorStop(0.00, '#ff0080');
        aliGrad.addColorStop(0.18, '#ff8c00');
        aliGrad.addColorStop(0.36, '#ffee00');
        aliGrad.addColorStop(0.54, '#00ff88');
        aliGrad.addColorStop(0.72, '#00baff');
        aliGrad.addColorStop(0.90, '#a000ff');
        aliGrad.addColorStop(1.00, '#ff0080');
        aliCtx.fillStyle = aliGrad;
        aliCtx.fillRect(0, 0, 256, 256);
        for (let i = 0; i < 220; i++) {
            aliCtx.fillStyle = `hsla(${Math.random() * 360}, 100%, 65%, ${Math.random() * 0.35})`;
            aliCtx.beginPath();
            aliCtx.arc(Math.random() * 256, Math.random() * 256, Math.random() * 18 + 2, 0, Math.PI * 2);
            aliCtx.fill();
        }
        const aliTexture = new THREE.CanvasTexture(aliCanvas);
        aliTexture.wrapS = THREE.RepeatWrapping;
        aliTexture.wrapT = THREE.RepeatWrapping;

        const aliMat = new THREE.MeshStandardMaterial({
            map: aliTexture,
            color: 0xffffff,
            emissive: new THREE.Color(0xffffff),
            emissiveMap: aliTexture,
            emissiveIntensity: 0.5,
            roughness: 0.25,
            metalness: 0.6
        });
        const ali = new THREE.Mesh(aliGeo, aliMat);
        ali.position.set(2.8, 0, 0);
        scene.add(ali);

        // --- 4. النصوص (العنوان واسم Ali) ---
        function createText(text, color, yPos, xPos, size = 3.2, fontSize = 80) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 12;
            ctx.fillStyle = color;
            ctx.font = `Bold ${fontSize}px 'Arial', 'Tahoma', sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;
            ctx.fillText(text, 256, 64);
            ctx.shadowColor = 'transparent';
            ctx.fillText(text, 256, 64);
            
            const tex = new THREE.CanvasTexture(canvas);
            tex.needsUpdate = true;
            const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, side: THREE.DoubleSide });
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(size, size * 0.35), mat);
            mesh.position.set(xPos, yPos, 0.05);
            return mesh;
        }

        const titleText = createText('فن يحچي', '#ffffff', 3.4, -1, 3.8, 90);
        scene.add(titleText);
        const aliText = createText('Ali', '#ff66ff', 1.5, 2.8, 2.2, 70);
        scene.add(aliText);

        // --- 5. نظام النجوم الأساسي (الكثيف) ---
        const starsCount = 6000;
        const starsGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(starsCount * 3);
        const colors = new Float32Array(starsCount * 3);
        const sizes = new Float32Array(starsCount);

        const radius = 40;
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            const r = radius * Math.cbrt(Math.random());
            positions[i*3] = Math.sin(phi) * Math.cos(theta) * r;
            positions[i*3+1] = Math.sin(phi) * Math.sin(theta) * r;
            positions[i*3+2] = Math.cos(phi) * r;

            const colorVal = 0.5 + Math.random() * 0.3;
            colors[i*3] = colorVal;
            colors[i*3+1] = colorVal * (0.8 + Math.random() * 0.2);
            colors[i*3+2] = colorVal * (0.9 + Math.random() * 0.1);
            sizes[i] = 0.04 + Math.random() * 0.2;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        starsGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        starsGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        const starCanvas = document.createElement('canvas');
        starCanvas.width = 32; starCanvas.height = 32;
        const sCtx = starCanvas.getContext('2d');
        const gradient = sCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(0.3, 'rgba(255,255,255,0.9)');
        gradient.addColorStop(0.7, 'rgba(200,200,255,0.5)');
        gradient.addColorStop(1, 'rgba(255,255,255,0)');
        sCtx.fillStyle = gradient;
        sCtx.fillRect(0, 0, 32, 32);
        const starTexture = new THREE.CanvasTexture(starCanvas);

        const starsMaterial = new THREE.PointsMaterial({
            size: 0.15,
            map: starTexture,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            vertexColors: true,
            opacity: 0.7,
            sizeAttenuation: true
        });
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        // --- 6. نجوم إضافية صغيرة جداً ---
        const tinyStarsCount = 4000;
        const tinyGeo = new THREE.BufferGeometry();
        const tinyPos = new Float32Array(tinyStarsCount * 3);
        for (let i = 0; i < tinyStarsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            const r = 60 + Math.random() * 30;
            tinyPos[i*3] = Math.sin(phi) * Math.cos(theta) * r;
            tinyPos[i*3+1] = Math.sin(phi) * Math.sin(theta) * r;
            tinyPos[i*3+2] = Math.cos(phi) * r;
        }
        tinyGeo.setAttribute('position', new THREE.BufferAttribute(tinyPos, 3));
        const tinyMat = new THREE.PointsMaterial({
            color: 0x446688,
            size: 0.06,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true
        });
        const tinyStars = new THREE.Points(tinyGeo, tinyMat);
        scene.add(tinyStars);

        // --- 7. النجوم المخصصة بالأسماء (تدور حول نفسها فقط) ---
        const names = [
            "رَوَاحة الكُبْرى",
            "جَواهِر",
            "ابو ذيبة",
            "المسيحي",
            "ضُّحَى",
            "إِسْكَنْدَر",
            "Dha",
            "جورج وسوف",
            "Nyar",
            "توجان",
            "لَوْذَع",
            "بنين",
            "لوزه",
            "Cherry"
        ];

        const starPositions = [
            { x: -2.5, y: 1.8, z: 2.5 },
            { x: 1.2, y: 2.5, z: 2.0 },
            { x: 3.5, y: -1.2, z: 1.8 },
            { x: -3.0, y: -2.0, z: 2.2 },
            { x: 0.5, y: -2.8, z: 2.0 },
            { x: -1.8, y: 2.8, z: 1.5 },
            { x: 2.8, y: 1.0, z: 2.8 },
            { x: -3.8, y: -0.5, z: 2.0 },
            { x: -1.2, y: -2.2, z: 2.8 },
            { x: 3.0, y: 2.2, z: 1.2 },
            { x: -2.8, y: -1.8, z: 2.5 },
            { x: 1.8, y: -1.0, z: 3.0 },
            { x: -0.5, y: 2.2, z: 3.2 },
            { x: 4.0, y: 0.5, z: 1.5 }
        ];

        const namedStars = [];

        names.forEach((name, index) => {
            const pos = starPositions[index % starPositions.length];
            const offsetX = (Math.random() - 0.5) * 0.3;
            const offsetY = (Math.random() - 0.5) * 0.3;
            const offsetZ = (Math.random() - 0.5) * 0.3;
            const finalPos = {
                x: pos.x + offsetX,
                y: pos.y + offsetY,
                z: pos.z + offsetZ
            };

            // نجمة بيضاء
            const starGeo = new THREE.SphereGeometry(0.22, 16, 16);
            const starMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                emissive: 0xffffff,
                emissiveIntensity: 0.5,
                roughness: 0.1,
                metalness: 0.0
            });
            const starMesh = new THREE.Mesh(starGeo, starMat);
            starMesh.position.set(finalPos.x, finalPos.y, finalPos.z);
            scene.add(starMesh);

            // هالة بيضاء
            const glowGeo = new THREE.SphereGeometry(0.35, 8, 8);
            const glowMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.15,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const glowMesh = new THREE.Mesh(glowGeo, glowMat);
            glowMesh.position.copy(starMesh.position);
            scene.add(glowMesh);

            // اسم الشخص
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx2 = canvas.getContext('2d');
            ctx2.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx2.shadowColor = 'rgba(0,0,0,0.9)';
            ctx2.shadowBlur = 16;
            ctx2.shadowOffsetX = 2;
            ctx2.shadowOffsetY = 2;
            
            ctx2.fillStyle = '#ffffff';
            ctx2.font = 'Bold 68px "Arial", "Tahoma", sans-serif';
            ctx2.textAlign = 'center';
            ctx2.textBaseline = 'middle';
            ctx2.fillText(name, 256, 64);
            
            ctx2.shadowColor = 'transparent';
            ctx2.fillStyle = '#ffffff';
            ctx2.font = 'Bold 68px "Arial", "Tahoma", sans-serif';
            ctx2.fillText(name, 256, 64);
            
            ctx2.shadowColor = 'rgba(0,0,0,0.5)';
            ctx2.shadowBlur = 8;
            ctx2.fillStyle = '#ffffff';
            ctx2.fillText(name, 256, 64);

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            
            const spriteMat = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                opacity: 0.95
            });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.position.set(finalPos.x, finalPos.y + 0.7, finalPos.z);
            sprite.scale.set(1.6, 0.4, 1);
            scene.add(sprite);

            namedStars.push({
                star: starMesh,
                glow: glowMesh,
                label: sprite,
                basePos: new THREE.Vector3(finalPos.x, finalPos.y, finalPos.z),
                phase: Math.random() * Math.PI * 2,
                rotSpeed: 0.02 + Math.random() * 0.03
            });
        });

        // --- 8. التحريك الرئيسي ---
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            const elapsed = clock.elapsedTime;

            // دوران الكوكب
            earth.rotation.y += 0.004;
            earth.rotation.x += 0.001;

            // دوران وتلوين الكويكب Ali
            ali.rotation.y += delta * 1.7;
            ali.rotation.x += delta * 0.9;
            ali.rotation.z += delta * 0.55;
            aliTexture.offset.x = (aliTexture.offset.x + delta * 0.12) % 1;
            aliTexture.offset.y = (aliTexture.offset.y + delta * 0.05) % 1;
            aliMat.emissiveIntensity = 0.45 + Math.sin(elapsed * 2.2) * 0.25;

            // دوران السديم
            nebula.rotation.y += 0.0002;
            nebula.rotation.x += 0.0001;

            // دوران النجوم الخلفية
            stars.rotation.y += 0.00006;
            stars.rotation.x += 0.00001;
            tinyStars.rotation.y -= 0.00004;

            // تحريك النجوم المخصصة (تدور حول نفسها وتهتز فقط)
            const time = Date.now() * 0.001;
            namedStars.forEach((item) => {
                // دوران النجمة حول نفسها
                item.star.rotation.x += item.rotSpeed;
                item.star.rotation.y += item.rotSpeed * 1.3;
                item.star.rotation.z += item.rotSpeed * 0.7;
                
                // اهتزاز بسيط في مكانها
                const offset = Math.sin(time * 1.2 + item.phase) * 0.03;
                item.star.position.y = item.basePos.y + offset;
                item.glow.position.y = item.basePos.y + offset;
                item.label.position.y = item.basePos.y + 0.7 + offset * 0.5;
                
                // تغير في شفافية الهالة
                const pulse = Math.sin(time * 1.8 + item.phase) * 0.05 + 0.15;
                item.glow.material.opacity = pulse;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // --- التكيف مع تغير حجم النافذة ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        console.log('✨ فن يحچي 3D - خلفية سوداء، نجوم بيضاء تدور حول نفسها!');
    })();
</script>
</body>
</html>
