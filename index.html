<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فن يحچي 3D - فضاء كودي</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000000; }
        canvas { display: block; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 8);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        // إضاءة عامة
        scene.add(new THREE.AmbientLight(0xffffff, 2.0));

        // --- 1. إنشاء خلفية النجوم (برمجياً) ---
        const starGeometry = new THREE.BufferGeometry();
        const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1 });
        const starVertices = [];
        for (let i = 0; i < 10000; i++) {
            const x = (Math.random() - 0.5) * 1000;
            const y = (Math.random() - 0.5) * 1000;
            const z = (Math.random() - 0.5) * 1000;
            starVertices.push(x, y, z);
        }
        starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        // --- 2. إنشاء سديم (مجرة ملونة) برمجياً ---
        const nebulaGeometry = new THREE.SphereGeometry(300, 64, 64);
        const nebulaMaterial = new THREE.MeshBasicMaterial({
            color: 0x330066,
            side: THREE.BackSide,
            transparent: true,
            opacity: 0.5
        });
        const nebula = new THREE.Mesh(nebulaGeometry, nebulaMaterial);
        scene.add(nebula);

        // --- 3. الكوكب الرئيسي (فن يحچي) ---
        const earthGeo = new THREE.SphereGeometry(2.1, 64, 64);
        const earthMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const earth = new THREE.Mesh(earthGeo, earthMat);
        earth.position.set(-1, 0, 0);
        scene.add(earth);
        
        const loader = new THREE.TextureLoader();
        loader.load('./myimage.jpg', (tex) => { earthMat.map = tex; earthMat.needsUpdate = true; });

        // --- 4. كويكب Ali ---
        const aliGeo = new THREE.SphereGeometry(0.8, 64, 64);
        const aliMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const ali = new THREE.Mesh(aliGeo, aliMat);
        ali.position.set(2.8, 0, 0);
        scene.add(ali);

        // النصوص (كما هي)
        function createText(text, color, yPos) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color;
            ctx.font = 'Bold 80px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(text, 256, 80);
            const tex = new THREE.CanvasTexture(canvas);
            const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(3, 1), mat);
            mesh.position.y = yPos;
            return mesh;
        }

        const titleText = createText('فن يحچي', '#ffffff', 3.3);
        titleText.position.x = -1;
        scene.add(titleText);

        const aliText = createText('Ali', '#ff00ff', 1.4);
        aliText.position.x = 2.8;
        scene.add(aliText);

        // التحريك
        function animate() {
            requestAnimationFrame(animate);
            earth.rotation.y += 0.005;
            ali.rotation.y += 0.01;
            stars.rotation.y += 0.0002;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
