<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فن يحچي 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #030008; }
        canvas { display: block; }
    </style>
    <!-- تضمين مكتبة Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <script>
        // --- الأساسيات ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 7);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- التحكم بالماوس / اللمس ---
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.6;
        controls.enableZoom = true;

        // --- إضاءة متكاملة ومباشرة ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
        scene.add(ambientLight);

        const light1 = new THREE.PointLight(0x00f0ff, 2, 50);
        light1.position.set(10, 10, 10);
        scene.add(light1);

        const light2 = new THREE.PointLight(0xff007f, 2, 50);
        light2.position.set(-10, -10, -10);
        scene.add(light2);

        // --- إنشاء مجسم الكرة المركزية ---
        const innerSphereGeometry = new THREE.SphereGeometry(2.3, 64, 64);
        
        const innerSphereMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const innerSphere = new THREE.Mesh(innerSphereGeometry, innerSphereMaterial);
        scene.add(innerSphere);

        // --- تحميل الصورة بمسار نسبي حاسم ---
        const loader = new THREE.TextureLoader();
        const imgPath = './myimage.jpg';
        
        loader.load(
            imgPath,
            function (texture) {
                innerSphereMaterial.map = texture;
                innerSphereMaterial.needsUpdate = true;
            },
            undefined,
            function (err) {
                loader.load('./myimage.JPG', function (altTexture) {
                    innerSphereMaterial.map = altTexture;
                    innerSphereMaterial.needsUpdate = true;
                });
            }
        );

        // --- إضافة نص "فن يحچي" ثلاثي الأبعاد مضيء فوق الكرة ---
        const textCanvas = document.createElement('canvas');
        textCanvas.width = 1024;
        textCanvas.height = 256;
        const textContext = textCanvas.getContext('2d');

        // إضافة توهج وضبابية نيونية حول النص
        textContext.shadowColor = '#00f0ff';
        textContext.shadowBlur = 25;
        textContext.font = 'Bold 95px "Segoe UI", Tahoma, Geneva, Verdana, sans-serif';
        textContext.fillStyle = '#ffffff';
        textContext.textAlign = 'center';
        textContext.textBaseline = 'middle';
        textContext.fillText('فن يحچي', textCanvas.width / 2, textCanvas.height / 2);

        const textTexture = new THREE.CanvasTexture(textCanvas);
        const textMaterial = new THREE.MeshBasicMaterial({
            map: textTexture,
            transparent: true,
            side: THREE.DoubleSide
        });

        const textGeometry = new THREE.PlaneGeometry(5.2, 1.3);
        const textMesh = new THREE.Mesh(textGeometry, textMaterial);
        textMesh.position.set(0, 3.5, 0); // موضع النص فوق الكرة تماماً
        scene.add(textMesh);

        // --- خلفية طبيعية فضائية ---
        const spaceGeometry = new THREE.SphereGeometry(25, 64, 64);
        
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 512;
        const context = canvas.getContext('2d');
        
        const gradient = context.createLinearGradient(0, 0, canvas.width, canvas.height);
        gradient.addColorStop(0, '#240046');   
        gradient.addColorStop(0.3, '#7209b7'); 
        gradient.addColorStop(0.6, '#f72585'); 
        gradient.addColorStop(0.8, '#4cc9f0'); 
        gradient.addColorStop(1, '#10002b');   

        context.fillStyle = gradient;
        context.fillRect(0, 0, canvas.width, canvas.height);

        const artGradientTexture = new THREE.CanvasTexture(canvas);
        const artBackgroundMaterial = new THREE.MeshBasicMaterial({
            map: artGradientTexture,
            side: THREE.BackSide
        });

        const outerSpaceSphere = new THREE.Mesh(spaceGeometry, artBackgroundMaterial);
        scene.add(outerSpaceSphere);

        // --- جزيئات ملونة ونجوم ---
        const particlesCount = 3000;
        const particlesGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particlesCount * 3);
        const colors = new Float32Array(particlesCount * 3);

        const colorOptions = [
            new THREE.Color(0xff70a6),
            new THREE.Color(0xff9770),
            new THREE.Color(0xffd670),
            new THREE.Color(0xe9ff70),
            new THREE.Color(0x70d6ff)
        ];

        for (let i = 0; i < particlesCount; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 45;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 45;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 45;

            const randomColor = colorOptions[Math.floor(Math.random() * colorOptions.length)];
            colors[i * 3] = randomColor.r;
            colors[i * 3 + 1] = randomColor.g;
            colors[i * 3 + 2] = randomColor.b;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.12,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.85
        });

        const starField = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(starField);

        // --- حلقة الحركة ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // دوران الكرة
            innerSphere.rotation.y += 0.0025;
            innerSphere.rotation.x += 0.0008;

            // تحريك النص بشكل طفو خفيف ودوران متناسق
            textMesh.position.y = 3.5 + Math.sin(elapsedTime * 2) * 0.1;
            textMesh.rotation.y += 0.0025;

            outerSpaceSphere.rotation.y -= 0.0003;
            starField.rotation.y += 0.0005;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
