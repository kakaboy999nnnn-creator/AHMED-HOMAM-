<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فن يحچي 3D - فضاء عميق</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000000; }
        canvas { display: block; }
    </style>
    <!-- تضمين مكتبة Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <script>
        // --- الأساسيات ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000); // زيادة مدى الرؤية للخلفية
        camera.position.set(0, 0, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- التحكم بالماوس / اللمس ---
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.6;
        controls.enableZoom = true;

        // --- الإضاءة (كما هي، قوية لضمان السطوع) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 3.0);
        scene.add(ambientLight);

        const textureLoader = new THREE.TextureLoader();

        // --- 1. إنشاء خلفية الفضاء والمجرات (Skybox) ---
        // قمنا بإنشاء كرة عملاقة تحيط بكل شيء وتكسوها صورة فضاء عميق فائقة الجودة
        const spaceGeometry = new THREE.SphereGeometry(500, 64, 64);
        
        // رابط مباشر لصورة بانورامية فائقة الجودة للفضاء العميق والمجرات من وكالة ناسا
        const spaceTextureUrl = "https://raw.githubusercontent.com/kakaboy999nnnn-creator/AHMED-HOMAM-/main/deep_space_galaxy.jpg";

        const spaceMaterial = new THREE.MeshBasicMaterial({
            side: THREE.BackSide, // يجعل الخامة تظهر من الداخل فقط
            transparent: true,
            opacity: 0
        });

        const starFieldBack = new THREE.Mesh(spaceGeometry, spaceMaterial);
        scene.add(starFieldBack);

        // محاولة تحميل الصورة مع معالجة الأخطاء لضمان الظهور
        textureLoader.load(
            spaceTextureUrl,
            function (texture) {
                spaceMaterial.map = texture;
                spaceMaterial.opacity = 1; // إظهار الخلفية فور التحميل
                spaceMaterial.needsUpdate = true;
            },
            undefined,
            function (err) {
                // في حال فشل تحميل الصورة البانورامية الكبيرة، نعتمد على حقل نجوم بسيط كخطة احتياطية
                const fallbackStars = new THREE.SphereGeometry(400, 32, 32);
                const fallbackMaterial = new THREE.MeshBasicMaterial({ color: 0x010103, side: THREE.BackSide });
                const fallback = new THREE.Mesh(fallbackStars, fallbackMaterial);
                scene.add(fallback);
                // كما نضيف حقل نجوم متناثر احتياطي
                const starsGeoFallback = new THREE.SphereGeometry(300, 10, 10);
                const starsMatFallback = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.1 });
                const starsFallback = new THREE.Mesh(starsGeoFallback, starsMatFallback);
                scene.add(starsFallback);
            }
        );


        // --- 2. الكوكب الرئيسي "فن يحچي" (كما هو تماماً) ---
        const innerSphereGeometry = new THREE.SphereGeometry(2.1, 64, 64);
        const innerSphereMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const innerSphere = new THREE.Mesh(innerSphereGeometry, innerSphereMaterial);
        innerSphere.position.set(-1.0, 0, 0); 
        scene.add(innerSphere);

        const imgPath = './myimage.jpg';
        
        textureLoader.load(
            imgPath,
            function (texture) {
                innerSphereMaterial.map = texture;
                innerSphereMaterial.needsUpdate = true;
            },
            undefined,
            function (err) {
                textureLoader.load('./myimage.JPG', function (altTexture) {
                    innerSphereMaterial.map = altTexture;
                    innerSphereMaterial.needsUpdate = true;
                });
            }
        );

        // --- 3. نص "فن يحچي" فوق الكوكب الرئيسي (كما هو) ---
        const textCanvas = document.createElement('canvas');
        textCanvas.width = 1024;
        textCanvas.height = 256;
        const textContext = textCanvas.getContext('2d');
        textContext.shadowColor = '#00f0ff';
        textContext.shadowBlur = 25;
        textContext.font = 'Bold 95px "Segoe UI", Tahoma, Geneva, Verdana, sans-serif';
        textContext.fillStyle = '#ffffff';
        textContext.textAlign = 'center';
        textContext.textBaseline = 'middle';
        textContext.fillText('فن يحچي', textCanvas.width / 2, textCanvas.height / 2);

        const textTexture = new THREE.CanvasTexture(textCanvas);
        const textMaterial = new THREE.MeshBasicMaterial({ map: textTexture, transparent: true, side: THREE.DoubleSide });
        const textMesh = new THREE.Mesh(new THREE.PlaneGeometry(4.8, 1.2), textMaterial);
        textMesh.position.set(-1.0, 3.3, 0);
        scene.add(textMesh);

        // --- 4. كويكب Ali الصغير المضيء والواضح (كما هو) ---
        const aliPlanetCanvas = document.createElement('canvas');
        aliPlanetCanvas.width = 512;
        aliPlanetCanvas.height = 256;
        const aliPlanetCtx = aliPlanetCanvas.getContext('2d');
        const grad = aliPlanetCtx.createLinearGradient(0, 0, 512, 256);
        grad.addColorStop(0, '#7209b7'); grad.addColorStop(0.5, '#f72585'); grad.addColorStop(1, '#4cc9f0');
        aliPlanetCtx.fillStyle = grad;
        aliPlanetCtx.fillRect(0, 0, 512, 256);
        aliPlanetCtx.fillStyle = '#ffffff';
        for (let i = 0; i < 30; i++) {
            aliPlanetCtx.beginPath();
            aliPlanetCtx.arc(Math.random() * 512, Math.random() * 256, Math.random() * 15 + 5, 0, Math.PI * 2);
            aliPlanetCtx.fill();
        }

        const aliPlanetTexture = new THREE.CanvasTexture(aliPlanetCanvas);
        const asteroidGeometry = new THREE.SphereGeometry(0.8, 64, 64);
        const asteroidMaterial = new THREE.MeshBasicMaterial({ map: aliPlanetTexture });
        const asteroid = new THREE.Mesh(asteroidGeometry, asteroidMaterial);
        asteroid.position.set(2.8, 0, 0); 
        scene.add(asteroid);

        // --- 5. نص "Ali" المضيء فوق الكويكب (كما هو) ---
        const aliCanvas = document.createElement('canvas');
        aliCanvas.width = 512;
        aliCanvas.height = 256;
        const aliContext = aliCanvas.getContext('2d');
        aliContext.shadowColor = '#ff007f';
        aliContext.shadowBlur = 30;
        aliContext.font = 'Bold 130px Arial, sans-serif';
        aliContext.fillStyle = '#ffffff';
        aliContext.textAlign = 'center';
        aliContext.textBaseline = 'middle';
        aliContext.fillText('Ali', aliCanvas.width / 2, aliCanvas.height / 2);

        const aliTexture = new THREE.CanvasTexture(aliCanvas);
        const aliMaterial = new THREE.MeshBasicMaterial({ map: aliTexture, transparent: true, side: THREE.DoubleSide });
        const aliMesh = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 1.1), aliMaterial);
        aliMesh.position.set(2.8, 1.4, 0);
        scene.add(aliMesh);


        // --- حلقة الحركة والتحريك (كما هي، مع إضافة دوران الخلفية) ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // دوران الأجسام الرئيسية (كما هو)
            innerSphere.rotation.y += 0.0025;
            innerSphere.rotation.x += 0.0008;
            textMesh.position.y = 3.3 + Math.sin(elapsedTime * 2) * 0.1;

            asteroid.rotation.y += 0.008;
            asteroid.rotation.x += 0.003;
            asteroid.position.y = Math.sin(elapsedTime * 1.5) * 0.15;
            aliMesh.position.y = 1.4 + Math.sin(elapsedTime * 1.5) * 0.15;

            // دوران الخلفية البانورامية العملاقة لإعطاء إحساس بالعمق والحركة في الكون
            starFieldBack.rotation.y += 0.0001; 
            starFieldBack.rotation.x += 0.00005;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // إعادة ضبط الحجم (كما هو)
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
