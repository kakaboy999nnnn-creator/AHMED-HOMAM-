<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فن يحچي 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000000; }
        canvas { display: block; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 8);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 2.0));

        // --- 1. الكوكب الرئيسي ---
        const earthGeo = new THREE.SphereGeometry(2.1, 64, 64);
        const earthMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const earth = new THREE.Mesh(earthGeo, earthMat);
        earth.position.set(-1, 0, 0);
        scene.add(earth);
        const loader = new THREE.TextureLoader();
        loader.load('./myimage.jpg', (tex) => { earthMat.map = tex; earthMat.needsUpdate = true; });

        // --- 2. الغبار الفضائي (Nebula) المضاف حديثاً ---
        const nebulaGeo = new THREE.SphereGeometry(20, 64, 64);
        const nebulaCanvas = document.createElement('canvas');
        nebulaCanvas.width = 512; nebulaCanvas.height = 512;
        const ctx = nebulaCanvas.getContext('2d');
        // رسم غبار فضائي برمجياً
        ctx.fillStyle = '#000000'; ctx.fillRect(0,0,512,512);
        for(let i=0; i<60; i++) {
           ctx.fillStyle = `rgba(${50+Math.random()*100}, 0, ${150+Math.random()*100}, ${Math.random()*0.3})`;
           ctx.beginPath(); ctx.arc(Math.random()*512, Math.random()*512, Math.random()*200, 0, Math.PI*2); ctx.fill();
        }
        const nebulaMat = new THREE.MeshBasicMaterial({
            map: new THREE.CanvasTexture(nebulaCanvas),
            side: THREE.BackSide,
            transparent: true,
            opacity: 0.6
        });
        const nebula = new THREE.Mesh(nebulaGeo, nebulaMat);
        scene.add(nebula);

        // --- 3. الكويكب Ali ---
        const aliGeo = new THREE.SphereGeometry(0.8, 64, 64);
        const aliMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const ali = new THREE.Mesh(aliGeo, aliMat);
        ali.position.set(2.8, 0, 0);
        scene.add(ali);

        // --- 4. النصوص ---
        function createText(text, color, yPos, xPos) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color;
            ctx.font = 'Bold 80px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(text, 256, 80);
            const tex = new THREE.CanvasTexture(canvas);
            const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(3, 1), mat);
            mesh.position.set(xPos, yPos, 0);
            return mesh;
        }

        const titleText = createText('فن يحچي', '#ffffff', 3.3, -1);
        scene.add(titleText);
        const aliText = createText('Ali', '#ff00ff', 1.4, 2.8);
        scene.add(aliText);

        // التحريك
        function animate() {
            requestAnimationFrame(animate);
            earth.rotation.y += 0.005;
            ali.rotation.y += 0.01;
            nebula.rotation.y += 0.0005; // دوران بطيء للغبار الفضائي
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
