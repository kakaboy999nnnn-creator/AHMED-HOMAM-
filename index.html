<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فن يحچي 3D - نجوم بيضاء</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000000; font-family: 'Arial', 'Tahoma', sans-serif; }
        canvas { display: block; }
        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            pointer-events: none;
            font-family: 'Arial', sans-serif;
            letter-spacing: 1px;
            z-index: 10;
        }
    </style>
    <!-- Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div class="info">✨ فن يحچي • اسحب للتدوير • المس نجمة لتفجيرها بالألوان ✨</div>
<script>
    (function() {
        // --- المشهد، الكاميرا، المُعَرِّض ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 9);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.domElement.style.touchAction = 'none'; // مهم لالتقاط اللمس بدقة مع OrbitControls
        document.body.appendChild(renderer.domElement);

        // التحكم بالكاميرا
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.target.set(0, 0, 0);
        controls.rotateSpeed = 0.7;
        controls.zoomSpeed = 1.0;

        // --- ساعة داخلية لحساب الزمن الحقيقي (تُستخدم في الانفجارات وتلوين Ali) ---
        const clock = new THREE.Clock();
        const raycaster = new THREE.Raycaster();
        const pointerNDC = new THREE.Vector2();
        const explosions = [];
        const shockwaves = [];
        const FLASH_DURATION = 0.45;

        // --- إضاءة ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(1, 2, 4);
        scene.add(dirLight);
        const backLight = new THREE.DirectionalLight(0x446688, 0.6);
        backLight.position.set(-2, 0, -3);
        scene.add(backLight);

        // --- 1. الكوكب الرئيسي ---
        const earthGeo = new THREE.SphereGeometry(2.1, 80, 80);
        const earthMat = new THREE.MeshStandardMaterial({ 
            color: 0x4488aa,
            roughness: 0.3, 
            metalness: 0.1,
            emissive: new THREE.Color(0x112233)
        });
        const earth = new THREE.Mesh(earthGeo, earthMat);
        earth.position.set(-1, 0, 0);
        scene.add(earth);

        // محاولة تحميل الصورة
        const loader = new THREE.TextureLoader();
        loader.load('./myimage.jpg', 
            (tex) => {
                earthMat.map = tex;
                earthMat.needsUpdate = true;
                earthMat.color.setHex(0xffffff);
                earthMat.emissive.setHex(0x000000);
            },
            undefined,
            (err) => {
                console.warn('لم يتم العثور على myimage.jpg، سيتم استخدام اللون الافتراضي', err);
                earthMat.color.setHex(0x4488aa);
            }
        );

        // --- 2. الغبار الفضائي (Nebula) ---
        const nebulaGeo = new THREE.SphereGeometry(18, 48, 48);
        const nebulaCanvas = document.createElement('canvas');
        nebulaCanvas.width = 512; nebulaCanvas.height = 512;
        const ctx = nebulaCanvas.getContext('2d');
        ctx.fillStyle = '#000000'; 
        ctx.fillRect(0, 0, 512, 512);
        for (let i = 0; i < 120; i++) {
            const r = 30 + Math.random() * 120;
            const g = 10 + Math.random() * 60;
            const b = 150 + Math.random() * 105;
            ctx.fillStyle = `rgba(${r|0}, ${g|0}, ${b|0}, ${Math.random() * 0.35 + 0.1})`;
            ctx.beginPath();
            ctx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 180 + 20, 0, Math.PI * 2);
            ctx.fill();
        }
        for (let i = 0; i < 30; i++) {
            ctx.fillStyle = `rgba(200, 180, 255, ${Math.random() * 0.2})`;
            ctx.beginPath();
            ctx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 60 + 10, 0, Math.PI * 2);
            ctx.fill();
        }
        const nebulaMat = new THREE.MeshBasicMaterial({
            map: new THREE.CanvasTexture(nebulaCanvas),
            side: THREE.BackSide,
            transparent: true,
            opacity: 0.55
        });
        const nebula = new THREE.Mesh(nebulaGeo, nebulaMat);
        scene.add(nebula);

        // --- 3. الكويكب Ali (متعدد الألوان ومتغيّر باستمرار) ---
        const aliGeo = new THREE.SphereGeometry(0.8, 48, 48);

        // نسيج قوس قزح إجرائي (Procedural) بدل اللون الواحد
        const aliCanvas = document.createElement('canvas');
        aliCanvas.width = 256; aliCanvas.height = 256;
        const aliCtx = aliCanvas.getContext('2d');
        const aliGrad = aliCtx.createLinearGradient(0, 0, 256, 256);
        aliGrad.addColorStop(0.00, '#ff0080');
        aliGrad.addColorStop(0.18, '#ff8c00');
        aliGrad.addColorStop(0.36, '#ffee00');
        aliGrad.addColorStop(0.54, '#00ff88');
        aliGrad.addColorStop(0.72, '#00baff');
        aliGrad.addColorStop(0.90, '#a000ff');
        aliGrad.addColorStop(1.00, '#ff0080');
        aliCtx.fillStyle = aliGrad;
        aliCtx.fillRect(0, 0, 256, 256);
        // بقع صغيرة لإعطاء ملمس معدني/كريستالي معقد
        for (let i = 0; i < 220; i++) {
            aliCtx.fillStyle = `hsla(${Math.random() * 360}, 100%, 65%, ${Math.random() * 0.35})`;
            aliCtx.beginPath();
            aliCtx.arc(Math.random() * 256, Math.random() * 256, Math.random() * 18 + 2, 0, Math.PI * 2);
            aliCtx.fill();
        }
        const aliTexture = new THREE.CanvasTexture(aliCanvas);
        aliTexture.wrapS = THREE.RepeatWrapping;
        aliTexture.wrapT = THREE.RepeatWrapping;

        const aliMat = new THREE.MeshStandardMaterial({
            map: aliTexture,
            color: 0xffffff,
            emissive: new THREE.Color(0xffffff),
            emissiveMap: aliTexture,
            emissiveIntensity: 0.5,
            roughness: 0.25,
            metalness: 0.6
        });
        const ali = new THREE.Mesh(aliGeo, aliMat);
        ali.position.set(2.8, 0, 0);
        scene.add(ali);

        // --- 4. النصوص (العنوان واسم Ali) ---
        function createText(text, color, yPos, xPos, size = 3.2, fontSize = 80) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 12;
            ctx.fillStyle = color;
            ctx.font = `Bold ${fontSize}px 'Arial', 'Tahoma', sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;
            ctx.fillText(text, 256, 64);
            ctx.shadowColor = 'transparent';
            ctx.fillText(text, 256, 64);
            
            const tex = new THREE.CanvasTexture(canvas);
            tex.needsUpdate = true;
            const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, side: THREE.DoubleSide });
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(size, size * 0.35), mat);
            mesh.position.set(xPos, yPos, 0.05);
            return mesh;
        }

        const titleText = createText('فن يحچي', '#ffffff', 3.4, -1, 3.8, 90);
        scene.add(titleText);
        const aliText = createText('Ali', '#ff66ff', 1.5, 2.8, 2.2, 70);
        scene.add(aliText);

        // --- 5. نظام النجوم الأساسي (الكثيف) ---
        const starsCount = 6000;
        const starsGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(starsCount * 3);
        const colors = new Float32Array(starsCount * 3);
        const sizes = new Float32Array(starsCount);

        const radius = 40;
        for (let i = 0; i < starsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            const r = radius * Math.cbrt(Math.random());
            positions[i*3] = Math.sin(phi) * Math.cos(theta) * r;
            positions[i*3+1] = Math.sin(phi) * Math.sin(theta) * r;
            positions[i*3+2] = Math.cos(phi) * r;

            const colorVal = 0.7 + Math.random() * 0.5;
            const tint = Math.random();
            if (tint < 0.6) {
                colors[i*3] = colorVal;
                colors[i*3+1] = colorVal * (0.8 + Math.random() * 0.2);
                colors[i*3+2] = 1.0;
            } else if (tint < 0.85) {
                colors[i*3] = 1.0;
                colors[i*3+1] = 0.7 + Math.random() * 0.3;
                colors[i*3+2] = 0.3 + Math.random() * 0.2;
            } else {
                colors[i*3] = 0.9 + Math.random() * 0.3;
                colors[i*3+1] = 0.3 + Math.random() * 0.3;
                colors[i*3+2] = 0.9 + Math.random() * 0.3;
            }
            sizes[i] = 0.05 + Math.random() * 0.25;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        starsGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        starsGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        const starCanvas = document.createElement('canvas');
        starCanvas.width = 32; starCanvas.height = 32;
        const sCtx = starCanvas.getContext('2d');
        const gradient = sCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(0.3, 'rgba(255,255,255,0.9)');
        gradient.addColorStop(0.7, 'rgba(180,180,255,0.6)');
        gradient.addColorStop(1, 'rgba(255,255,255,0)');
        sCtx.fillStyle = gradient;
        sCtx.fillRect(0, 0, 32, 32);
        const starTexture = new THREE.CanvasTexture(starCanvas);

        const starsMaterial = new THREE.PointsMaterial({
            size: 0.2,
            map: starTexture,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            vertexColors: true,
            opacity: 0.95,
            sizeAttenuation: true
        });
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        // --- 6. نجوم إضافية صغيرة جداً ---
        const tinyStarsCount = 4000;
        const tinyGeo = new THREE.BufferGeometry();
        const tinyPos = new Float32Array(tinyStarsCount * 3);
        for (let i = 0; i < tinyStarsCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            const r = 60 + Math.random() * 30;
            tinyPos[i*3] = Math.sin(phi) * Math.cos(theta) * r;
            tinyPos[i*3+1] = Math.sin(phi) * Math.sin(theta) * r;
            tinyPos[i*3+2] = Math.cos(phi) * r;
        }
        tinyGeo.setAttribute('position', new THREE.BufferAttribute(tinyPos, 3));
        const tinyMat = new THREE.PointsMaterial({
            color: 0x88aaff,
            size: 0.08,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true
        });
        const tinyStars = new THREE.Points(tinyGeo, tinyMat);
        scene.add(tinyStars);

        // --- 7. النجوم المخصصة بالأسماء (بيضاء اللون، تدور، وقابلة للمس) ---
        const names = [
            "رَوَاحة الكُبْرى",
            "جَواهِر",
            "ابو ذيبة",
            "المسيحي",
            "ضُّحَى",
            "إِسْكَنْدَر",
            "Dha",
            "جورج وسوف"
        ];

        const starPositions = [
            { x: -2.5, y: 1.8, z: 2.5 },
            { x: 1.2, y: 2.5, z: 2.0 },
            { x: 3.5, y: -1.2, z: 1.8 },
            { x: -3.0, y: -2.0, z: 2.2 },
            { x: 0.5, y: -2.8, z: 2.0 },
            { x: -1.8, y: 2.8, z: 1.5 },
            { x: 2.8, y: 1.0, z: 2.8 },
            { x: -3.8, y: -0.5, z: 2.0 }
        ];

        const namedStars = [];

        names.forEach((name, index) => {
            const pos = starPositions[index % starPositions.length];
            const offsetX = (Math.random() - 0.5) * 0.4;
            const offsetY = (Math.random() - 0.5) * 0.4;
            const offsetZ = (Math.random() - 0.5) * 0.4;
            const finalPos = {
                x: pos.x + offsetX,
                y: pos.y + offsetY,
                z: pos.z + offsetZ
            };

            // نجمة بيضاء
            const starGeo = new THREE.SphereGeometry(0.22, 16, 16);
            const starMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                emissive: 0xffffff,
                emissiveIntensity: 0.5,
                roughness: 0.1,
                metalness: 0.0
            });
            const starMesh = new THREE.Mesh(starGeo, starMat);
            starMesh.position.set(finalPos.x, finalPos.y, finalPos.z);
            scene.add(starMesh);

            // هالة بيضاء
            const glowGeo = new THREE.SphereGeometry(0.35, 8, 8);
            const glowMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.15,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const glowMesh = new THREE.Mesh(glowGeo, glowMat);
            glowMesh.position.copy(starMesh.position);
            scene.add(glowMesh);

            // هدف لمس خفي أكبر من النجمة نفسها (لتسهيل اللمس على الجوال)
            const hitGeo = new THREE.SphereGeometry(0.55, 8, 8);
            const hitMat = new THREE.MeshBasicMaterial({ visible: false });
            const hitMesh = new THREE.Mesh(hitGeo, hitMat);
            hitMesh.position.copy(starMesh.position);
            hitMesh.userData.starIndex = index;
            scene.add(hitMesh);

            // اسم الشخص
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx2 = canvas.getContext('2d');
            ctx2.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx2.shadowColor = 'rgba(0,0,0,0.9)';
            ctx2.shadowBlur = 16;
            ctx2.shadowOffsetX = 2;
            ctx2.shadowOffsetY = 2;
            
            ctx2.fillStyle = '#ffffff';
            ctx2.font = 'Bold 68px "Arial", "Tahoma", sans-serif';
            ctx2.textAlign = 'center';
            ctx2.textBaseline = 'middle';
            ctx2.fillText(name, 256, 64);
            
            ctx2.shadowColor = 'transparent';
            ctx2.fillStyle = '#ffffff';
            ctx2.font = 'Bold 68px "Arial", "Tahoma", sans-serif';
            ctx2.fillText(name, 256, 64);
            
            ctx2.shadowColor = 'rgba(0,0,0,0.5)';
            ctx2.shadowBlur = 8;
            ctx2.fillStyle = '#ffffff';
            ctx2.fillText(name, 256, 64);

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            
            const spriteMat = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                opacity: 0.95
            });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.position.set(finalPos.x, finalPos.y + 0.7, finalPos.z);
            sprite.scale.set(1.6, 0.4, 1);
            scene.add(sprite);

            namedStars.push({
                star: starMesh,
                glow: glowMesh,
                hitMesh: hitMesh,
                label: sprite,
                basePos: new THREE.Vector3(finalPos.x, finalPos.y, finalPos.z),
                phase: Math.random() * Math.PI * 2,
                rotSpeed: 0.02 + Math.random() * 0.03,
                flashUntil: 0
            });
        });

        const starHitMeshes = namedStars.map((item) => item.hitMesh);

        // --- 8. نظام الانفجارات الملونة عند لمس النجوم ---
        function createExplosion(position) {
            const count = 110;
            const geo = new THREE.BufferGeometry();
            const posArr = new Float32Array(count * 3);
            const velArr = new Float32Array(count * 3);
            const colArr = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                posArr[i*3] = position.x;
                posArr[i*3+1] = position.y;
                posArr[i*3+2] = position.z;

                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(Math.random() * 2 - 1);
                const speed = 1.8 + Math.random() * 3.0;
                velArr[i*3]   = Math.sin(phi) * Math.cos(theta) * speed;
                velArr[i*3+1] = Math.sin(phi) * Math.sin(theta) * speed;
                velArr[i*3+2] = Math.cos(phi) * speed;

                const hue = Math.random();
                const c = new THREE.Color();
                c.setHSL(hue, 1.0, 0.55 + Math.random() * 0.2);
                colArr[i*3] = c.r;
                colArr[i*3+1] = c.g;
                colArr[i*3+2] = c.b;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colArr, 3));

            const mat = new THREE.PointsMaterial({
                size: 0.22,
                map: starTexture,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                depthWrite: false,
                opacity: 1.0,
                sizeAttenuation: true
            });

            const points = new THREE.Points(geo, mat);
            scene.add(points);
            explosions.push({ points, velocities: velArr, life: 0, maxLife: 1.5 });

            // موجة صدمة حلقية متوهجة
            const ringGeo = new THREE.RingGeometry(0.05, 0.16, 40);
            const ringMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.85,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.copy(position);
            ring.lookAt(camera.position);
            scene.add(ring);
            shockwaves.push({ mesh: ring, life: 0, maxLife: 0.75 });
        }

        function updateExplosions(delta) {
            for (let i = explosions.length - 1; i >= 0; i--) {
                const ex = explosions[i];
                ex.life += delta;
                const t = ex.life / ex.maxLife;
                if (t >= 1) {
                    scene.remove(ex.points);
                    ex.points.geometry.dispose();
                    ex.points.material.dispose();
                    explosions.splice(i, 1);
                    continue;
                }
                const posAttr = ex.points.geometry.attributes.position;
